name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add conda to system path
        run: echo "$CONDA/bin" >> "$GITHUB_PATH"

      - name: Create Conda environment
        run: conda env create --file environment.yml

      - name: Install lint and test tools
        run: conda install --name eva flake8 pytest --yes

      - name: Lint with flake8
        run: |
          conda run --name eva flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          conda run --name eva flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: conda run --name eva pytest
