[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = [".venv-*", "assets", "data", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Configuration imports must follow loading .env and setting up logging.
"main.py" = ["E402"]
# Preserve the existing public string representations of these enums.
"core/events.py" = ["UP042"]
"visual_cortex/state.py" = ["UP042"]
